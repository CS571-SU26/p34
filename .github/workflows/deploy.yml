name: Deploy Tidal Wave to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          # Pin an exact version while diagnosing the npm CLI crash.
          node-version: 22.4.1
          package-manager-cache: false

      - name: Show tool versions
        run: |
          node --version
          npm --version

      - name: Install dependencies
        run: npm install --no-audit --no-fund --loglevel verbose

      - name: Print npm debug log on install failure
        if: failure()
        run: |
          echo "npm failed. Available debug logs:"
          find "$HOME/.npm/_logs" -maxdepth 1 -type f -print 2>/dev/null || true
          latest_log="$(find "$HOME/.npm/_logs" -maxdepth 1 -type f 2>/dev/null | sort | tail -n 1)"
          if [ -n "$latest_log" ]; then
            echo "----- BEGIN $latest_log -----"
            cat "$latest_log"
            echo "----- END $latest_log -----"
          else
            echo "No npm debug log was found."
          fi

      - name: Build
        env:
          VITE_TIDAL_CLIENT_ID: ${{ vars.VITE_TIDAL_CLIENT_ID }}
          VITE_TIDAL_REDIRECT_URI: https://cs571-su26.github.io/p34/
        run: npm run build

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
